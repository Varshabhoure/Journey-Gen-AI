<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FAFF"/><stop offset="1" stop-color="#F0F4FF"/></linearGradient></defs>
<g font-family="Inter, DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="url(#bg2)" stroke="none" stroke-width="1"/>
<rect x="62" y="30" width="281" height="40" rx="19" fill="#EEE9FE" stroke="none" stroke-width="1"/>
<text x="83" y="57" font-size="16" font-weight="800" fill="#6445B6" text-anchor="start" >AGENT EXECUTION FLOW</text>
<text x="62" y="120" font-size="40" font-weight="850" fill="#17264B" text-anchor="start" >How Journey Gen AI generates a trip</text>
<text x="62" y="156" font-size="20" font-weight="500" fill="#687791" text-anchor="start" >Conditional research → structured itinerary → review and optional single-day regeneration</text>
<rect x="64" y="236" width="410" height="187" rx="18" fill="#FFFFFF" stroke="#D9E0EF" stroke-width="1.7"/>
<rect x="86" y="255" width="46" height="46" rx="14" fill="#7953DE" stroke="none" stroke-width="1"/>
<text x="109" y="286" font-size="23" font-weight="850" fill="#FFFFFF" text-anchor="middle" >1</text>
<text x="86" y="341" font-size="23" font-weight="800" fill="#1E2D54" text-anchor="start" >TRAVEL INPUT</text>
<text x="86" y="373" font-size="18" font-weight="500" fill="#5E6F8C" text-anchor="start" >User selects source, destination,</text>
<text x="86" y="400" font-size="18" font-weight="500" fill="#5E6F8C" text-anchor="start" >dates, travelers and preferences.</text>
<path d="M476 332 L510 332" stroke="#8469D4" stroke-width="4" fill="none" />
<path d="M510 332 L499 326 L499 338 Z" fill="#8469D4"/>
<rect x="514" y="236" width="410" height="187" rx="18" fill="#FFFFFF" stroke="#D9E0EF" stroke-width="1.7"/>
<rect x="536" y="255" width="46" height="46" rx="14" fill="#428FE7" stroke="none" stroke-width="1"/>
<text x="559" y="286" font-size="23" font-weight="850" fill="#FFFFFF" text-anchor="middle" >2</text>
<text x="536" y="341" font-size="23" font-weight="800" fill="#1E2D54" text-anchor="start" >SUPERVISOR</text>
<text x="536" y="373" font-size="18" font-weight="500" fill="#5E6F8C" text-anchor="start" >Chooses requested research agents;</text>
<text x="536" y="400" font-size="18" font-weight="500" fill="#5E6F8C" text-anchor="start" >itinerary always runs.</text>
<path d="M926 332 L960 332" stroke="#8469D4" stroke-width="4" fill="none" />
<path d="M960 332 L949 326 L949 338 Z" fill="#8469D4"/>
