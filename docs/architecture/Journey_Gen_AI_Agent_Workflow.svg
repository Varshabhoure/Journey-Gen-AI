<rect x="986" y="255" width="46" height="46" rx="14" fill="#28A48A" stroke="none" stroke-width="1"/>
<text x="1009" y="286" font-size="23" font-weight="850" fill="#FFFFFF" text-anchor="middle" >3</text>
<text x="986" y="341" font-size="23" font-weight="800" fill="#1E2D54" text-anchor="start" >RESEARCH &amp; ITINERARY</text>
<text x="986" y="373" font-size="18" font-weight="500" fill="#5E6F8C" text-anchor="start" >Research provides references;</text>
<text x="986" y="400" font-size="18" font-weight="500" fill="#5E6F8C" text-anchor="start" >LLM prepares the day-wise plan.</text>
<path d="M1376 332 L1410 332" stroke="#8469D4" stroke-width="4" fill="none" />
<path d="M1410 332 L1399 326 L1399 338 Z" fill="#8469D4"/>
<rect x="1414" y="236" width="410" height="187" rx="18" fill="#FFFFFF" stroke="#D9E0EF" stroke-width="1.7"/>
<rect x="1436" y="255" width="46" height="46" rx="14" fill="#D39A42" stroke="none" stroke-width="1"/>
<text x="1459" y="286" font-size="23" font-weight="850" fill="#FFFFFF" text-anchor="middle" >4</text>
<text x="1436" y="341" font-size="23" font-weight="800" fill="#1E2D54" text-anchor="start" >TRAVELER REVIEW</text>
<text x="1436" y="373" font-size="18" font-weight="500" fill="#5E6F8C" text-anchor="start" >Accept, regenerate one day,</text>
<text x="1436" y="400" font-size="18" font-weight="500" fill="#5E6F8C" text-anchor="start" >or save/share the itinerary.</text>
<rect x="66" y="488" width="1790" height="410" rx="22" fill="#FFFFFF" stroke="#DFE4F0" stroke-width="1.7"/>
<text x="92" y="534" font-size="25" font-weight="810" fill="#1B2A50" text-anchor="start" >Conditional agent routing</text>
<text x="92" y="567" font-size="17" font-weight="500" fill="#62728E" text-anchor="start" >These agents run only when the corresponding option is selected in the Planner:</text>
<rect x="92" y="606" width="327" height="135" rx="15" fill="#F8F9FD" stroke="#E0E5F2" stroke-width="1.3"/>
<rect x="109" y="626" width="9" height="95" rx="5" fill="#8B5ED4" stroke="none" stroke-width="1"/>
<text x="133" y="654" font-size="20" font-weight="800" fill="#202F57" text-anchor="start" >FLIGHT</text>
<text x="133" y="691" font-size="16" font-weight="500" fill="#62718A" text-anchor="start" >Selected air transport</text>
<rect x="441" y="606" width="327" height="135" rx="15" fill="#F8F9FD" stroke="#E0E5F2" stroke-width="1.3"/>
<rect x="458" y="626" width="9" height="95" rx="5" fill="#487DD1" stroke="none" stroke-width="1"/>
<text x="482" y="654" font-size="20" font-weight="800" fill="#202F57" text-anchor="start" >TRAIN</text>
<text x="482" y="691" font-size="16" font-weight="500" fill="#62718A" text-anchor="start" >Selected rail transport</text>
<rect x="790" y="606" width="327" height="135" rx="15" fill="#F8F9FD" stroke="#E0E5F2" stroke-width="1.3"/>
<rect x="807" y="626" width="9" height="95" rx="5" fill="#3A9A8C" stroke="none" stroke-width="1"/>
<text x="831" y="654" font-size="20" font-weight="800" fill="#202F57" text-anchor="start" >HOTEL</text>
<text x="831" y="691" font-size="16" font-weight="500" fill="#62718A" text-anchor="start" >Selected stay category</text>
<rect x="1139" y="606" width="327" height="135" rx="15" fill="#F8F9FD" stroke="#E0E5F2" stroke-width="1.3"/>
<rect x="1156" y="626" width="9" height="95" rx="5" fill="#D19B3F" stroke="none" stroke-width="1"/>
<text x="1180" y="654" font-size="20" font-weight="800" fill="#202F57" text-anchor="start" >WEATHER</text>
<text x="1180" y="691" font-size="16" font-weight="500" fill="#62718A" text-anchor="start" >Weather preference</text>
<rect x="1488" y="606" width="327" height="135" rx="15" fill="#F8F9FD" stroke="#E0E5F2" stroke-width="1.3"/>
<rect x="1505" y="626" width="9" height="95" rx="5" fill="#BE6898" stroke="none" stroke-width="1"/>
<text x="1529" y="654" font-size="20" font-weight="800" fill="#202F57" text-anchor="start" >BUDGET</text>
<text x="1529" y="691" font-size="16" font-weight="500" fill="#62718A" text-anchor="start" >Budget preference</text>
<rect x="92" y="770" width="1708" height="87" rx="14" fill="#F2ECFF" stroke="#D9C9F5" stroke-width="1.3"/>
<text x="120" y="804" font-size="19" font-weight="850" fill="#6041AA" text-anchor="start" >ALWAYS:</text>
<text x="234" y="804" font-size="19" font-weight="500" fill="#344265" text-anchor="start" >The itinerary agent constructs the trip, including any requested bus or road planning options.</text>
<text x="121" y="835" font-size="16" font-weight="500" fill="#73678E" text-anchor="start" >Research results are references, not verified tickets, hotel reservations or final prices.</text>
<rect x="66" y="928" width="1790" height="89" rx="16" fill="#E9F8F2" stroke="#C9EADC" stroke-width="1.4"/>
<text x="92" y="961" font-size="17" font-weight="830" fill="#277E65" text-anchor="start" >AFTER GENERATION</text>
<text x="308" y="961" font-size="20" font-weight="700" fill="#274C50" text-anchor="start" >Preview regenerated day → Accept changes or Keep Original → Save in SQLite → Share read-only link</text>
<text x="92" y="993" font-size="17" font-weight="500" fill="#58716E" text-anchor="start" >The other days stay unchanged when a single-day alternative is accepted.</text>
</g></svg>